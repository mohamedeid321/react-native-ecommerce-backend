name: Refresh session performance
on:
  push:
    branches: [develop/lotta-web-backend]
    paths:
      - 'performance/refresh.js'
      - '.github/workflows/refresh-performance.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      MONGO_URI: mongodb://127.0.0.1:27017/lotta_performance
      REDIS_URL: redis://127.0.0.1:6379
      CLIENT_URL: http://localhost:5173
      NODE_ENV: test
      PUBLIC_CACHE_ENABLED: '1'
      PUBLIC_CACHE_NAMESPACE: refresh
      PORT: 3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - name: Start isolated Mongo replica set
        run: |
          docker run -d --name lotta-perf-mongo -p 27017:27017 mongo:7 --replSet rs0 --bind_ip_all
          for i in $(seq 1 30); do
            if docker exec lotta-perf-mongo mongosh --quiet --eval 'db.adminCommand({ping:1}).ok' | grep -q 1; then break; fi
            sleep 2
          done
          docker exec lotta-perf-mongo mongosh --quiet --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"127.0.0.1:27017"}]})'
          for i in $(seq 1 30); do
            if docker exec lotta-perf-mongo mongosh --quiet --eval 'db.hello().isWritablePrimary' | grep -q true; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Generate disposable fixture and start API
        run: |
          echo "JWT_ACCESS_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - name: Seed disposable fixture
        run: |
          node performance/seed.js
      - name: Start full Express app
        run: |
          node src/index.js > /tmp/lotta-perf-api.log 2>&1 &
          echo $! > /tmp/lotta-perf-api.pid
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/api/health/ready; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Refresh 1000 real sessions and verify revocation
        run: node performance/refresh.js
      - name: Cleanup
        if: always()
        run: |
          rm -f performance/fixture.json
          if [ -f /tmp/lotta-perf-api.pid ]; then kill "$(cat /tmp/lotta-perf-api.pid)" || true; fi
          docker rm -f lotta-perf-mongo || true
